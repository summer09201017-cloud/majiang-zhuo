<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a3520">
<!-- 📱 加到主畫面後全螢幕(沒有地址欄,牌桌大一截);iOS 認 apple- 那個舊的 -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="麻將桌">
<title>麻將桌 · 台灣 16 張</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<!-- ⚠ iOS 的主畫面圖示**不吃 SVG** ⇒ 一定要給 PNG,否則加到主畫面會變成一張網頁縮圖 -->
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<style>
  html, body { margin: 0; height: 100%; background: #0a3520; overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent }
  canvas { display: block; position: fixed; inset: 0 }
  /* 📱 直向蓋版提示(最小版;完整的「手勢中自動進全螢幕+鎖 landscape」三件組在 M5)。
     16 張手牌直向塞不下 —— 與其讓人看到擠爛的牌桌,不如直接請他轉橫。 */
  #rotate { display: none; position: fixed; inset: 0; z-index: 9; background: #0a3520;
    color: #eafaf0; font: 600 20px/1.7 system-ui, sans-serif; text-align: center;
    align-items: center; justify-content: center; padding: 24px }
  @media (orientation: portrait) { #rotate { display: flex } canvas { visibility: hidden } }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="rotate">🀄<br>請把手機轉成<b>橫向</b><br><span style="font-size:15px;opacity:.7">16 張手牌需要橫的畫面</span></div>
<script src="src/config.js"></script>
<script src="src/tiles.js"></script>
<script src="src/rules/hu.js"></script>
<script src="src/rules/shanten.js"></script>
<script src="src/rules/meld.js"></script>
<script src="src/rules/score.js"></script>
<script src="src/table.js"></script>
<script src="src/ai.js"></script>
<script src="src/confetti.js"></script>
<script src="src/sfx.js"></script>
<script src="src/game.js"></script>
<script src="src/renderer.js"></script>
<script src="src/input.js"></script>
<script>
  // 📡 統計打點三層(skill play-stats-lite / play-stats-dwell)。2026-09-05 使用者拍板:所有作品一律接統計,不再有「家庭系不接」的例外。
  //    零個資:只送「站 id + 事件(+秒數)」,沒有 cookie、沒有帳號、不記 IP。離線 / 被擋 / 本機預覽一律靜默 —— 統計是配菜,壞掉絕不影響遊戲。
  //    ★ 端點只有 /api/ping、秒數參數只認 t(0903 三站打到 404 一天多沒人發現的教訓;寫錯不會報錯,資料只會靜靜消失)。
  //    ★ 黑名單不白名單:只擋本機開發,搬站(pages.dev ↔ workers.dev)不會斷流(0813 約拿白名單斷流三週的教訓)。
  (function () {
    var ID = 'majiang-zhuo'
    var API = 'https://hfpc-play-stats.summer09201017.workers.dev/api/ping?g='
    var LOCAL = ['localhost', '127.0.0.1', '::1', ''].indexOf(location.hostname) >= 0 || location.protocol === 'file:'
    window.psPing = function (evt, sec) {   // evt 例:ID(開啟)/ ID-done(完賽)/ ID-dwell(停留,帶秒)
      if (LOCAL) return
      try {
        var u = API + evt + (sec ? '&t=' + Math.round(sec) : '')
        if (navigator.sendBeacon) navigator.sendBeacon(u)
        else fetch(u, { mode: 'no-cors', keepalive: true }).catch(function () {})
      } catch (e) { /* 統計是配菜:不重試、不報錯 */ }
    }
    window.psDone = function () { window.psPing(ID + '-done') }   // ② 完賽:遊戲碼在「一局分出結果」那一刻呼叫
    window.psPing(ID)                                             // ① 開啟
    var t0 = Date.now(), sent = false
    function dwell () {                                           // ③ 真實停留:開頁到第一次離開,只發一次(遊戲語意,3~1800 秒才算)
      if (sent) return
      sent = true
      var sec = (Date.now() - t0) / 1000
      if (sec >= 3 && sec <= 1800) window.psPing(ID + '-dwell', sec)
    }
    addEventListener('pagehide', dwell)
    addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') dwell() })
  })()
</script>
<script>
// SW:localhost 一律 unregister(dev 快取雷,紙牌桌/彈珠檯老規矩);線上才註冊
if ('serviceWorker' in navigator) {
  const local = location.hostname === 'localhost' || location.hostname === '127.0.0.1'
  if (local) navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister()))
  else addEventListener('load', () => navigator.serviceWorker.register('sw.js'))
}
// 📱 強制橫式全螢幕(skill force-landscape-pwa 三件組之三;之一是 manifest 的 orientation、
//    之二是上面那個直向蓋版提示)。
// ★ 一定要在**使用者手勢裡**呼叫,而且全部包 try/catch:桌機瀏覽器與 iOS 都可能拒絕,
//   被拒絕不可以讓遊戲壞掉。⚙ 面板裡另外有一顆手動的。
function lockLandscape() {
  try {
    if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {})
  } catch (e) {}
}
window.goFullscreen = function () {
  var ok = false
  try {
    var el = document.documentElement
    var rq = el.requestFullscreen || el.webkitRequestFullscreen
    if (rq && !document.fullscreenElement) {
      var p = rq.call(el)
      ok = true
      if (p && p.then) p.then(lockLandscape, function () {})
      else lockLandscape()
    }
  } catch (e) {}
  if (!ok) lockLandscape()
  return ok
}
// 只在觸控裝置自動試一次(桌機不要沒問就搶全螢幕);失敗就算了
try {
  if (matchMedia('(pointer: coarse)').matches) {
    addEventListener('pointerdown', function () { window.goFullscreen() }, { once: true })
  }
} catch (e) {}

game.boot()
// 🔬 給 Playwright 驗收用的把手。★ src 裡的 const 宣告**不會**掛上 window
//    (0901 第一次驗收就在 waitForFunction(() => window.renderer) 卡住 8 秒 —— 那是驗法的錯,不是遊戲的錯)。
window.__game = game
window.__renderer = renderer
</script>
</body>
</html>
